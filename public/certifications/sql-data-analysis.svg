<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" rx="36" fill="#07111F"/>
  <circle cx="200" cy="140" r="230" fill="#0EA5E9" fill-opacity="0.16"/>
  <circle cx="1020" cy="640" r="260" fill="#10B981" fill-opacity="0.12"/>
  <rect x="90" y="92" width="1020" height="566" rx="28" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  <text x="120" y="165" fill="#34D399" font-family="Arial, sans-serif" font-size="34" font-weight="700">Database Analytics</text>
  <text x="120" y="235" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="58" font-weight="800">SQL for Data Analysis</text>
  <text x="120" y="292" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="28">JOIN • GROUP BY • CASE WHEN • CTE</text>
  <rect x="130" y="350" width="940" height="170" rx="20" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <text x="160" y="400" fill="#38BDF8" font-family="Consolas, monospace" font-size="28">SELECT customer, SUM(revenue) AS total</text>
