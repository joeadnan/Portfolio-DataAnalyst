  <text x="160" y="490" fill="#FBBF24" font-family="Consolas, monospace" font-size="28">GROUP BY customer;</text>
  <text x="120" y="590" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="26">Portfolio Learning Card</text>
